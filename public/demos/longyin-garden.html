<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>龙隐庭 · 体素空岛庭园</title>
<style>
  :root{
    --paper:#f6efe0; --ink:#2b2622; --ink-soft:#6b6157; --red:#b8382c; --gold:#c9973a; --line:rgba(43,38,34,.16);
    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#cfe9f5;color:var(--ink);font-family:var(--serif)}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  .panel{background:rgba(246,239,224,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid var(--line);box-shadow:0 6px 24px rgba(30,20,10,.16)}
  #title{position:fixed;left:18px;top:18px;display:flex;gap:12px;align-items:stretch;padding:14px 14px 14px 12px;border-radius:4px;pointer-events:none}
  #title .seal{writing-mode:vertical-rl;background:var(--red);color:#fbeedd;font-size:22px;font-weight:700;letter-spacing:.28em;
    padding:10px 6px 6px;border-radius:3px;line-height:1}
  #title .sub{writing-mode:vertical-rl;font-size:12px;letter-spacing:.3em;color:var(--ink-soft);padding-top:2px}
  #found{position:fixed;right:18px;top:18px;padding:12px 14px;border-radius:4px;min-width:150px}
  #found h2{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.24em;color:var(--ink-soft);display:flex;justify-content:space-between;gap:12px}
  #found h2 b{color:var(--red);font-variant-numeric:tabular-nums;letter-spacing:.05em}
  #found ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
  #found li{font-size:13px;display:flex;align-items:center;gap:8px;color:rgba(43,38,34,.42);transition:color .4s}
  #found li::before{content:"";width:9px;height:9px;border:1px solid currentColor;flex:none;transition:all .4s}
  #found li.on{color:var(--ink)}
  #found li.on::before{background:var(--red);border-color:var(--red);transform:rotate(45deg)}
  #bar{position:fixed;left:12px;right:12px;bottom:18px;margin:0 auto;width:fit-content;display:flex;align-items:center;gap:6px;padding:6px;border-radius:4px;flex-wrap:wrap;justify-content:center}
  #bar button{font:inherit;font-size:13px;letter-spacing:.12em;color:var(--ink);background:transparent;border:1px solid transparent;
    padding:8px 13px;border-radius:3px;cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s,color .2s}
  #bar button:hover{background:rgba(43,38,34,.07)}
  #bar button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
  #bar button.on{background:var(--ink);color:var(--paper)}
  #bar button kbd{font:inherit;font-size:10px;opacity:.5;margin-left:6px;letter-spacing:0}
  #time{display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;border-right:1px solid var(--line);margin-right:2px}
  #clock{font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:.06em;min-width:44px}
  #per{font-size:12px;color:var(--red);min-width:14px}
  #tod{-webkit-appearance:none;appearance:none;width:190px;height:8px;border-radius:2px;outline-offset:4px;cursor:pointer;margin:0;
    background:linear-gradient(90deg,#10163a 0,#10163a 19%,#ff9d6c 25%,#7cc1f0 33%,#7cc1f0 67%,#ff8a4a 75%,#10163a 81%,#10163a 100%)}
  #tod::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:20px;background:var(--paper);border:2px solid var(--ink);border-radius:2px}
  #tod::-moz-range-thumb{width:9px;height:17px;background:var(--paper);border:2px solid var(--ink);border-radius:2px}
  #presets{display:flex}
  #bar #presets button{padding:6px 6px;font-size:12px;letter-spacing:0;color:var(--ink-soft)}
  #hint{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);font-size:12px;letter-spacing:.18em;color:#fff;
    text-shadow:0 1px 6px rgba(0,0,0,.55);pointer-events:none;transition:opacity 1.2s;text-align:center;width:max-content;max-width:92vw}
  #tip{position:fixed;left:0;top:0;padding:6px 10px;font-size:12px;letter-spacing:.1em;border-radius:3px;pointer-events:none;opacity:0;
    transition:opacity .15s;white-space:nowrap;z-index:5}
  .bubble{position:fixed;left:0;top:0;padding:7px 11px;font-size:13px;border-radius:10px;background:#fffaf0;border:1px solid var(--line);
    box-shadow:0 4px 14px rgba(30,20,10,.2);pointer-events:none;white-space:nowrap;transform:translate(-50%,-100%);z-index:4}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:#fffaf0;border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
  #toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);padding:14px 26px;font-size:17px;letter-spacing:.3em;border-radius:4px;
    opacity:0;transition:opacity .8s;pointer-events:none;border-left:4px solid var(--red)}
  #load{position:fixed;inset:0;display:grid;place-items:center;background:var(--paper);z-index:10;transition:opacity .8s;font-size:15px;letter-spacing:.4em;color:var(--ink-soft)}
  @media (max-width:640px){
    #title{left:10px;top:10px;padding:8px}#title .seal{font-size:17px}#title .sub{display:none}
    #found{right:10px;top:10px;padding:8px 10px;min-width:0}#found ul{grid-template-columns:1fr 1fr;gap:4px 10px}#found li{font-size:12px}
    #bar{bottom:10px}#bar button{padding:7px 9px;font-size:12px}#bar button kbd{display:none}#hint{bottom:150px}
    #time{border-right:0;width:100%;justify-content:center;padding:4px 4px 0}#tod{flex:1;width:auto;min-width:80px}
  }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="体素日式庭园岛三维场景"></canvas>

<div id="title" class="panel"><div class="seal">龙隐庭</div><div class="sub">体素空岛庭园</div></div>

<div id="found" class="panel">
  <h2><span>庭中秘事</span><b id="cnt">0/6</b></h2>
  <ul>
    <li data-k="lantern">石灯笼</li><li data-k="villager">村民</li><li data-k="dragon">巨龙</li>
    <li data-k="cherry">樱花树</li><li data-k="bell">梵钟</li><li data-k="pond">锦鲤池</li>
  </ul>
</div>

<div id="hint">拖动旋转 · 滚轮缩放 · 右键平移 · 拖动时刻条换昼夜 · 点击庭中万物</div>
<div id="bar" class="panel">
  <div id="time">
    <span id="clock">09:30</span><b id="per">朝</b>
    <input id="tod" type="range" min="0" max="23.99" step="0.01" value="9.5" aria-label="一天中的时刻">
    <span id="presets"><button data-h="6.2">晨</button><button data-h="12">午</button><button data-h="17.9">暮</button><button data-h="23">夜</button></span>
  </div>
  <button id="bFlow">时光流转<kbd>T</kbd></button>
  <button id="bNight">昼 / 夜<kbd>N</kbd></button>
  <button id="bFire">龙息<kbd>空格</kbd></button>
  <button id="bFollow">随龙视角<kbd>F</kbd></button>
  <button id="bSpin" class="on">缓转<kbd>R</kbd></button>
  <button id="bSound" class="on">声音<kbd>M</kbd></button>
</div>
<div id="tip" class="panel"></div>
<div id="toast" class="panel"></div>
<div id="load">正在堆砌体素 …</div>

<script>
/* ---------- 加载 three.js（多个 CDN 依次尝试，直接双击打开即可运行） ---------- */
(function(){
  var urls=[
    'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',
    'https://unpkg.com/three@0.160.0/build/three.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js',
    'https://registry.npmmirror.com/three/0.160.0/files/build/three.min.js'
  ], i=0;
  function next(){
    if(i>=urls.length){document.getElementById('load').textContent='three.js 加载失败，请检查网络';return;}
    var s=document.createElement('script'); s.src=urls[i++];
    s.onload=function(){ window.THREE ? setTimeout(main,30) : next(); }; s.onerror=next;
    document.head.appendChild(s);
  }
  next();
})();

function main(){
'use strict';
const T=THREE, V3=T.Vector3;
const $=id=>document.getElementById(id);

/* ================= 基础工具 ================= */
function hash3(x,y,z){ let h=(x*374761393+y*668265263+z*1274126177)|0; h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967296; }
function vnoise(x,z){ const xi=Math.floor(x),zi=Math.floor(z),fx=x-xi,fz=z-zi,u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz);
  const a=hash3(xi,7,zi),b=hash3(xi+1,7,zi),c=hash3(xi,7,zi+1),d=hash3(xi+1,7,zi+1); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
function fbm(x,z){ return vnoise(x,z)*.6+vnoise(x*2.1+7,z*2.1+3)*.3+vnoise(x*4.3+1,z*4.3+9)*.1; }
function rngOf(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
const rnd=rngOf(20240607);
const pick=a=>a[(rnd()*a.length)|0];
const smooth=(a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));

/* ================= 渲染器 / 场景 ================= */
const canvas=$('c');
const renderer=new T.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();
scene.fog=new T.Fog(0xcfe9f5,170,520);
const camera=new T.PerspectiveCamera(38,1,1,1200);

const hemi=new T.HemisphereLight(0xcfe6ff,0x8a7a5a,1.2); scene.add(hemi);
const sun=new T.DirectionalLight(0xfff1d6,2.4); sun.position.set(70,100,34); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-66,right:66,top:66,bottom:-66,near:10,far:300});
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.35; scene.add(sun);

const skyU={top:{value:new T.Color()},bot:{value:new T.Color()}};
const sky=new T.Mesh(new T.SphereGeometry(900,24,12),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,uniforms:skyU,
  vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top;uniform vec3 bot;varying vec3 vP;void main(){float h=clamp(normalize(vP).y*1.5+.02,0.,1.);gl_FragColor=vec4(mix(bot,top,pow(h,.65)),1.);\n#include <colorspace_fragment>\n}'}));
scene.add(sky);

/* ================= 体素仓库 ================= */
const vox=new Map(), details=[], glow=[];
const K=(x,y,z)=>((x+128)<<16)|((y+32)<<8)|(z+128);
const vset=(x,y,z,c)=>vox.set(K(x,y,z),c);
const vget=(x,y,z)=>vox.get(K(x,y,z));
const vhas=(x,y,z)=>vox.has(K(x,y,z));
const vdel=(x,y,z)=>vox.delete(K(x,y,z));
const D=(x,y,z,sx,sy,sz,c)=>details.push([x,y,z,sx,sy,sz,c]);   // 小尺寸体素（以中心定位）
const G=(x,y,z)=>{ vdel(x,y,z); glow.push([x,y,z]); };         // 夜间发光的窗纸

/* 调色板 */
const C={
  grass:[0x74b352,0x6aa94a,0x7fbd5c,0x63a046], sand:0xe8d8a6, sand2:0xdccb96, dirt:0x8b6b4a, stone:0x8a8d92, stoneD:0x6f7277, stoneL:0xb9b5a8,
  path:[0xcdc6b4,0xbfb7a3,0xd6cfbe], bed:0x2f6f74, red:0xb93a2c, redD:0x8f2a21, wall:0xf1e8d4, wood:0x9b7448, woodD:0x4a3423,
  roof:0x34424d, roofL:0x44555f, roofE:0x232d35, gold:0xe7b23c, black:0x26262b, trunk:0x5a4030, trunkD:0x46301f,
  pink:[0xffc4d8,0xffabc8,0xf791b5,0xffdbe8], pine:[0x2f6b4a,0x2a5f41,0x3a7a52], maple:[0xd9482b,0xe8702a,0xf0a030,0xc23a22],
  bush:[0x4f9148,0x5aa052,0x478541], bamboo:0x8fbf4f, bambooD:0x5f9638, thatch:0x7a6746, thatchD:0x55472f, zen:0xece4cc, zenD:0xd6ccb0
};

/* ================= 地形 ================= */
const R=38, HILL={x:-13,z:-13}, POND={x:14,z:10,rx:9,rz:6};
const hmap=new Map(), pondSet=new Set(), reserved=new Set();
const rk=(x,z)=>(x+128)*256+(z+128);
const H=(x,z)=>{ const h=hmap.get(rk(x,z)); return h===undefined?-1:h; };
const isPond=(x,z)=>pondSet.has(rk(x,z));
function reserve(x0,z0,x1,z1){ for(let x=x0;x<=x1;x++)for(let z=z0;z<=z1;z++)reserved.add(rk(x,z)); }
function nearReserved(x,z,r){ for(let dx=-r;dx<=r;dx++)for(let dz=-r;dz<=r;dz++) if(reserved.has(rk(x+dx,z+dz)))return true; return false; }
const onStairs=(x,z)=>z>=-14&&z<=-12&&x>=-5&&x<=5;

const tmap=new Map();
function calcH(x,z){
  const dh=Math.hypot(x-HILL.x,z-HILL.z);
  const d=Math.hypot(x,z), edge=R+(fbm(x*.07+11,z*.07+5)-.5)*10, t=d/edge;
  tmap.set(rk(x,z),Math.min(t,.99));
  if(dh<=8.5) return 10;
  if(onStairs(x,z)) return 10-Math.ceil((x+6)/2);
  if(t>=1) return -1;
  let h=t>.94?3:4;
  h+=Math.round(6*smooth(14,8.5,dh));
  if((z===10||z===11)&&x>=22){ pondSet.add(rk(x,z)); return 3; }      // 溢水渠，通向岛缘瀑布
  const pe=((x-POND.x)/POND.rx)**2+((z-POND.z)/POND.rz)**2+(vnoise(x*.3,z*.3)-.5)*.25;
  if(pe<1){ pondSet.add(rk(x,z)); return 2; }
  return h;
}
for(let x=-48;x<=48;x++)for(let z=-48;z<=48;z++){ const h=calcH(x,z); if(h>=0)hmap.set(rk(x,z),h); }
for(let x=-48;x<=48;x++)for(let z=-48;z<=48;z++){
  const h=H(x,z); if(h<0)continue;
  let steep=0; for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){ const n=H(x+dx,z+dz); if(n>=0)steep=Math.max(steep,Math.abs(h-n)); }
  const hs=hash3(x,1,z); let top;
  if(isPond(x,z)) top=hs<.2?0x3b7f80:C.bed;
  else if(onStairs(x,z)) top=hs<.5?C.stoneL:0xaeaa9c;
  else if(h<=3) top=hs<.4?C.stone:C.grass[3];
  else if(steep>=2) top=hs<.5?C.stone:C.stoneD;
  else top=C.grass[(hs*C.grass.length)|0];
  // 空岛岛底：倒锥形岩体 + 垂岩 + 晶石
  const t=tmap.get(rk(x,z)); let dep=1+Math.round(Math.pow(1-t,.75)*24*(.7+.6*fbm(x*.09+3,z*.09+8)));
  if(hash3(x,21,z)<.05) dep+=2+((hash3(x,22,z)*5)|0);
  const bot=-Math.min(30,dep);
  for(let y=bot;y<=h;y++){
    let c=top;
    if(y<h){ const r=hash3(x,y,z);
      if(onStairs(x,z)&&y>=0) c=C.stoneD;
      else if(y>=h-1&&h>2) c=C.dirt;
      else if(y>=h-3) c=r<.5?C.dirt:0x7a5c40;
      else if(y>-6) c=r<.5?C.stone:C.stoneD;
      else c=[0x6a6d73,0x5c5f66,0x52555c][(r*3)|0];
      if(y===bot&&hash3(x,23,z)<.14) c=0x6fe3d6; }
    vset(x,y,z,c);
  }
  // 池岸石
  if(!isPond(x,z)&&h===4){ let rim=false; for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]) if(isPond(x+dx,z+dz))rim=true;
    if(rim){ if(hs<.4)vset(x,h,z,hs<.2?C.stone:C.stoneD); if(hs>.9)vset(x,h+1,z,C.stone); } }
}
pondSet.forEach(k=>reserved.add(k));

/* 海上岩柱 */
function rockStack(cx,cz,r,hh){ let best=[cx,0,cz];
  for(let x=Math.floor(cx-r-1);x<=cx+r+1;x++)for(let z=Math.floor(cz-r-1);z<=cz+r+1;z++){
    const d=Math.hypot(x-cx,z-cz)/(r*(.8+.4*vnoise(x*.6,z*.6))); if(d>=1)continue;
    const h=2+Math.round(hh*.35*Math.pow(1-d,.5)), b=-Math.round(hh*1.4*Math.pow(1-d,.7))-(hash3(x,3,z)<.12?2:0);
    hmap.set(rk(x,z),h); reserved.add(rk(x,z));
    for(let y=b;y<=h;y++)vset(x,y,z,y===h?C.grass[1]:(y===h-1?C.dirt:(y===b&&hash3(x,4,z)<.2?0x6fe3d6:(hash3(x,y,z)<.5?C.stone:C.stoneD))));
    if(h>best[1])best=[x,h,z];
  } return best; }

/* ================= 造景函数 ================= */
function blob(cx,cy,cz,r,cols,sy=1){ const n=Math.ceil(r);
  for(let dx=-n;dx<=n;dx++)for(let dy=-n;dy<=n;dy++)for(let dz=-n;dz<=n;dz++){
    if(Math.hypot(dx,dy/sy,dz)<=r-rnd()*.9) vset(cx+dx,cy+dy,cz+dz,pick(cols)); } }
function box(x0,y0,z0,x1,y1,z1,c){ for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)vset(x,y,z,typeof c==='function'?c(x,y,z):c); }

const cherries=[];
function cherry(x,z,y){ y=y??H(x,z)+1;
  for(let i=0;i<5;i++)vset(x,y+i,z,i<2?C.trunkD:C.trunk);
  vset(x+1,y+3,z,C.trunk); vset(x-1,y+4,z,C.trunk); vset(x,y+4,z+1,C.trunk);
  blob(x,y+6,z,3.3,C.pink); blob(x+2,y+5,z+1,2.4,C.pink); blob(x-2,y+5,z-1,2.4,C.pink); blob(x,y+5,z-2,2.1,C.pink); blob(x-1,y+7,z+1,2,C.pink);
  cherries.push({x,y:y+6,z}); reserve(x-1,z-1,x+1,z+1); }
function pine(x,z,y){ y=y??H(x,z)+1; const hgt=6+((rnd()*3)|0), lean=rnd()<.5?1:-1;
  for(let i=0;i<hgt;i++)vset(x+(i>3?lean:0),y+i,z,C.trunkD);
  blob(x+lean,y+hgt,z,2.9,C.pine,.45); blob(x+lean*3,y+hgt-2,z+1,2.2,C.pine,.45); blob(x-lean*2,y+hgt-3,z-1,2,C.pine,.45);
  vset(x+lean*2,y+hgt-2,z+1,C.trunkD); vset(x-lean,y+hgt-3,z-1,C.trunkD); reserve(x-1,z-1,x+1,z+1); }
function maple(x,z){ const y=H(x,z)+1; for(let i=0;i<4;i++)vset(x,y+i,z,C.trunk);
  blob(x,y+5,z,2.7,C.maple,.8); blob(x+1,y+4,z-1,1.9,C.maple); blob(x-1,y+4,z+1,1.8,C.maple); reserve(x-1,z-1,x+1,z+1); }
function bamboo(x,z){ const y=H(x,z)+1, hgt=7+((rnd()*6)|0);
  for(let i=0;i<hgt;i++)D(x,y+i,z,.36,1,.36,i%3===2?C.bambooD:C.bamboo);
  for(let k=0;k<5;k++)D(x+(rnd()-.5)*1.6,y+hgt-rnd()*2.4,z+(rnd()-.5)*1.6,.7,.3,.7,rnd()<.5?C.bamboo:0xa6cf63); reserved.add(rk(x,z)); }
function bush(x,z){ const y=H(x,z)+1; blob(x,y,z,1.5,C.bush,.75); if(rnd()<.6){ const f=pick([0xff8fb1,0xffffff,0xffd24a]);
  for(let k=0;k<3;k++)D(x+(rnd()-.5)*2,y+.9+rnd()*.4,z+(rnd()-.5)*2,.35,.35,.35,f);} reserved.add(rk(x,z)); }

function pagoda(cx,cz,y){

  const hb=[4,3,3,2,2], bh=[4,3,3,3,3], rr=[7,6,5,4,3]; let Y=y+1;
  for(let i=0;i<5;i++){
    const b=hb[i];
    if(i>0&&b+1<=rr[i-1]-2){ for(let dx=-b-1;dx<=b+1;dx++)for(let dz=-b-1;dz<=b+1;dz++)
      if(Math.max(Math.abs(dx),Math.abs(dz))===b+1)D(cx+dx,Y-.2,cz+dz,(Math.abs(dx)===b+1&&Math.abs(dz)===b+1)?.4:1,.6,(Math.abs(dx)===b+1&&Math.abs(dz)===b+1)?.4:1,C.red); }
    for(let yy=0;yy<bh[i];yy++)for(let dx=-b;dx<=b;dx++)for(let dz=-b;dz<=b;dz++){
      const ax=Math.abs(dx),az=Math.abs(dz); if(Math.max(ax,az)!==b)continue;
      const corner=ax===b&&az===b, mid=Math.min(ax,az)===0, post=b===4&&Math.min(ax,az)===2;
      let c=C.wall;
      if(corner||post)c=C.red; else if(yy===bh[i]-1)c=C.redD; else if(yy===0)c=C.woodD;
      vset(cx+dx,Y+yy,cz+dz,c);
      if(mid&&yy>0&&yy<bh[i]-1)G(cx+dx,Y+yy,cz+dz);
      if(b===4&&yy>0&&yy<bh[i]-1&&Math.min(ax,az)===3&&!corner)G(cx+dx,Y+yy,cz+dz);
      if(i===0&&dx===b&&az<=1&&yy<3){ const k=glow.findIndex(g=>g[0]===cx+dx&&g[1]===Y+yy&&g[2]===cz+dz); if(k>=0)glow.splice(k,1); vset(cx+dx,Y+yy,cz+dz,az===0?0x2b1a12:C.woodD); }
    }
    Y+=bh[i];
    const r=rr[i], layers=i===4?[3,2,1]:[r,r-2];
    layers.forEach((hr,li)=>{ for(let dx=-hr;dx<=hr;dx++)for(let dz=-hr;dz<=hr;dz++){
      const ax=Math.abs(dx),az=Math.abs(dz), edge=Math.max(ax,az)===hr, corner=ax===hr&&az===hr;
      if(li===0&&corner){ vset(cx+dx,Y+1,cz+dz,C.roofE); D(cx+dx,Y-.05,cz+dz,.3,.5,.3,C.gold); continue; }
      vset(cx+dx,Y+li,cz+dz,edge?C.roofE:(li===0?C.roof:C.roofL)); } });
    Y+=layers.length;
  }
  for(let k=0;k<6;k++)D(cx,Y+k,cz,.4,1,.4,C.gold);
  for(let k=1;k<=4;k++)D(cx,Y+k+.1,cz,1.9-k*.3,.22,1.9-k*.3,C.gold);
  D(cx,Y-.3,cz,1.3,.5,1.3,C.gold); D(cx,Y+6.1,cz,.7,.7,.7,0xffe9a0);
  return Y+6;
}

    const k=1-Math.max(0,p.life)/p.max, s=.5+k*1.4;

    if(k<.4)col.copy(cF1).lerp(cF2,k/.4); else col.copy(cF2).lerp(cF3,(k-.4)/.6); col.multiplyScalar(1-k*.7); FIRE.mesh.setColorAt(i,col); }
  FIRE.mesh.instanceMatrix.needsUpdate=true; FIRE.mesh.instanceColor.needsUpdate=true; }

const PET={n:340,p:[],i:0}; PET.mesh=new T.InstancedMesh(UB,new T.MeshLambertMaterial(),PET.n); PET.mesh.frustumCulled=false; scene.add(PET.mesh);
const eul=new T.Euler(), qT=new T.Quaternion();
function resetPetal(p,tree,burst){ const c=tree||pick(cherries); if(!c){p.life=0;return;}
  p.x=c.x+(rnd()-.5)*6; p.y=c.y+(rnd()-.3)*4; p.z=c.z+(rnd()-.5)*6; p.life=6+rnd()*8; p.rx=rnd()*6;p.ry=rnd()*6;p.w=rnd()*6;
  if(burst){ const a=rnd()*6.28, s=3+rnd()*6; p.vx=Math.cos(a)*s;p.vz=Math.sin(a)*s;p.vy=1+rnd()*5; } else { p.vx=0;p.vz=0;p.vy=-(.8+rnd()*.8); p.life*=rnd(); } }
for(let i=0;i<PET.n;i++){ const p={}; resetPetal(p); p.y-=rnd()*6; PET.p.push(p); PET.mesh.setColorAt(i,col.setHex(pick(C.pink))); }
function burstPetals(tree,n){ for(let k=0;k<n;k++){ PET.i=(PET.i+1)%PET.n; resetPetal(PET.p[PET.i],tree,true); } }
function updatePetals(dt,t){ for(let i=0;i<PET.n;i++){ const p=PET.p[i]; p.life-=dt;
    p.vx+=(1.1+Math.sin(t*.6+p.w)*.9-p.vx)*dt*1.2; p.vz+=(Math.cos(t*.5+p.w)*.8-p.vz)*dt*1.2; p.vy+=(-1.2-p.vy)*dt*1.5;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt; p.rx+=dt*2.2; p.ry+=dt*1.6;
    const gh=H(Math.round(p.x),Math.round(p.z)); if(p.life<=0||p.y<(gh<0?-30:gh+.55))resetPetal(p);
    eul.set(p.rx,p.ry,0); qT.setFromEuler(eul); m4.compose(vP.set(p.x,p.y,p.z),qT,vS.set(.3,.06,.3)); PET.mesh.setMatrixAt(i,m4); }
  PET.mesh.instanceMatrix.needsUpdate=true; }

const FLY={n:70,p:[]}; FLY.mesh=new T.InstancedMesh(UB,new T.MeshBasicMaterial({color:0xdcff7a}),FLY.n); FLY.mesh.frustumCulled=false; scene.add(FLY.mesh);
for(let i=0;i<FLY.n;i++){ let x,z,h,g=0; do{ const a=rnd()*6.28,d=Math.sqrt(rnd())*30; x=Math.cos(a)*d; z=Math.sin(a)*d; h=H(Math.round(x),Math.round(z)); }while((h<3||h>9)&&g++<30);
  FLY.p.push({x,y:Math.max(h,4)+1.2+rnd()*3,z,w:rnd()*10}); }
function updateFlies(t,nf){ FLY.mesh.visible=nf>.03; if(!FLY.mesh.visible)return;
  for(let i=0;i<FLY.n;i++){ const p=FLY.p[i], s=.22*nf*(.55+.45*Math.sin(t*3+p.w*7));
    m4.compose(vP.set(p.x+Math.sin(t*.5+p.w)*1.8,p.y+Math.sin(t*.8+p.w*2)*.8,p.z+Math.cos(t*.4+p.w)*1.8),q0,vS.set(s,s,s)); FLY.mesh.setMatrixAt(i,m4); }
  FLY.mesh.instanceMatrix.needsUpdate=true; }

const ripples=[]; (function(){ const g=new T.RingGeometry(.84,1,4,1); g.rotateX(-Math.PI/2);
  for(let i=0;i<9;i++){ const m=new T.Mesh(g,new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false})); m.visible=false; scene.add(m); ripples.push({m,t:9}); } })();
let ripI=0; function ripple(x,z,delay=0){ const r=ripples[ripI=(ripI+1)%ripples.length]; r.t=-delay; r.m.position.set(x,4.26,z); r.m.rotation.y=rnd()*3; }
function updateRipples(dt){ for(const r of ripples){ r.t+=dt; const k=r.t/1.6; r.m.visible=k>0&&k<1; if(r.m.visible){ const s=.4+k*3.6; r.m.scale.set(s,1,s); r.m.material.opacity=(1-k)*.8; } } }

/* ---------- 云 / 日月 / 星 ---------- */
const clouds=[];
for(let i=0;i<9;i++){ const g=new T.Group(); const n=4+((rnd()*4)|0);
  for(let k=0;k<n;k++){ const m=new T.Mesh(UB,cloudMat); m.scale.set(5+rnd()*8,2+rnd()*2,4+rnd()*6); m.position.set((rnd()-.5)*12,(rnd()-.5)*2,(rnd()-.5)*8); g.add(m); }
  g.position.set((rnd()-.5)*300,52+rnd()*26,(rnd()-.5)*300); g.userData.s=1.2+rnd()*1.6; scene.add(g); clouds.push(g); }
const sunCube=part(scene,34,34,34,0xfff0b0,0,0,0,true); sunCube.material.fog=false;
const moonCube=part(scene,22,22,22,0xe9eeff,0,0,0,true); moonCube.material.fog=false; part(moonCube,.3,.3,.02,0xc9d0ea,.15,.2,.5,true).material.fog=false; part(moonCube,.2,.2,.02,0xc9d0ea,-.2,-.15,.5,true).material.fog=false;
const stars=(function(){ const pos=[]; for(let i=0;i<700;i++){ const a=rnd()*6.283, e=Math.asin(rnd()*.98+.02); pos.push(Math.cos(a)*Math.cos(e)*800,Math.sin(e)*800,Math.sin(a)*Math.cos(e)*800); }
  const g=new T.BufferGeometry(); g.setAttribute('position',new T.Float32BufferAttribute(pos,3));
  const p=new T.Points(g,new T.PointsMaterial({color:0xffffff,size:2.2,sizeAttenuation:false,transparent:true,opacity:0,fog:false,depthWrite:false})); scene.add(p); return p; })();

/* ================= 昼夜 ================= */
/* tod：0–24 的连续时刻。6 点日出、12 点正午、18 点日落 */
let tod=9.5, todGoal=null, flow=false, nf=0, wasNight=null;
const cc=h=>new T.Color(h);
const SKY={dT:cc(0x4c9be0),dB:cc(0xcfe9f5),nT:cc(0x070b24),nB:cc(0x27305e),dawn:cc(0xffb59a),dusk:cc(0xff8a4a),violet:cc(0x6a5a9a)};
const LGT={sd:cc(0xfff1d6),sl:cc(0xff9a55),sn:cc(0x8ea6ff),hd:cc(0xcfe6ff),hn:cc(0x39477f),hw:cc(0xffc9a0),gd:cc(0xa3957a),gn:cc(0x15182a),wd:cc(0xd9cfb4),wn:cc(0xffcf70),lo:cc(0x4a4638),ln:cc(0xffd88a),
  cd:cc(0xffffff),cw:cc(0xffc6a6),s1:cc(0xfff0b0),s2:cc(0xff7a3a)};
const sunDir=new V3();
const PERIODS=[[4.5,'夜'],[7,'晨'],[11,'朝'],[14,'午'],[16.5,'昼'],[19,'暮'],[24,'夜']];
function syncTime(){ const h=Math.floor(tod)%24, m=Math.floor((tod%1)*60); $('clock').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  $('per').textContent=PERIODS.find(p=>tod<p[0])[1]; if(document.activeElement!==$('tod')||flow||todGoal!==null)$('tod').value=tod; }
function updateDayNight(dt,t){
  if(todGoal!==null){ const d=((todGoal-tod)%24+24)%24, st=dt*9; if(d<=st){ tod=todGoal; todGoal=null; } else tod=(tod+st)%24; syncTime(); }
  else if(flow){ tod=(tod+dt*.4)%24; syncTime(); }
  const s=(tod-6)/12*Math.PI, el=Math.sin(s), up=el>=0;
  sunDir.set(Math.cos(s),el,.38).normalize();
  nf=1-smooth(-.3,.12,el);
  const dusk=Math.exp(-Math.pow(el/.28,2));
  skyU.top.value.copy(SKY.dT).lerp(SKY.nT,nf).lerp(SKY.violet,dusk*.28);
  skyU.bot.value.copy(SKY.dB).lerp(SKY.nB,nf).lerp(tod<12?SKY.dawn:SKY.dusk,dusk*.72);
  scene.fog.color.copy(skyU.bot.value);
  // 主光：白天跟随太阳，夜里跟随月亮；贴近地平线时压低强度以平滑切换
  const k=up?1:-1; sun.position.set(sunDir.x*k,Math.max(Math.abs(sunDir.y),.2),sunDir.z*k).normalize().multiplyScalar(130);
  if(up){ sun.color.copy(LGT.sl).lerp(LGT.sd,smooth(0,.5,el)); sun.intensity=.04+2.4*smooth(-.02,.3,el); }
  else { sun.color.copy(LGT.sn); sun.intensity=.04+.6*smooth(.02,.3,-el); }
  hemi.color.copy(LGT.hd).lerp(LGT.hn,nf).lerp(LGT.hw,dusk*.35); hemi.groundColor.copy(LGT.gd).lerp(LGT.gn,nf); hemi.intensity=lerp(1.2,.75,nf);
  glowMat.color.copy(LGT.wd).lerp(LGT.wn,nf); stars.material.opacity=nf*.9; cloudMat.color.copy(LGT.cd).lerp(LGT.cw,dusk*.6);
  sunCube.position.copy(sunDir).multiplyScalar(560); sunCube.visible=el>-.16; sunCube.material.color.copy(LGT.s2).lerp(LGT.s1,smooth(0,.4,el));
  moonCube.position.set(-sunDir.x,-sunDir.y,-.3).normalize().multiplyScalar(520); moonCube.visible=el<.16; moonCube.lookAt(0,0,0);
  const isN=nf>.55; if(isN!==wasNight){ wasNight=isN; lanterns.forEach(L=>L.on=isN); $('bNight').classList.toggle('on',isN); }
  for(const L of lanterns){ L.k+=((L.on?1:0)-L.k)*Math.min(1,dt*6); L.box.material.color.copy(LGT.lo).lerp(LGT.ln,L.k); L.light.intensity=L.k*(10+48*nf)*(1+Math.sin(t*9+L.box.id)*.05); }
  DR.pearlLight.intensity=30+130*nf;
}
function setTime(h){ tod=((h%24)+24)%24; todGoal=null; syncTime(); }
function setFlow(v){ flow=v; $('bFlow').classList.toggle('on',v); }

/* ================= 声音（WebAudio 合成） ================= */
let AC=null, master=null, muted=false;
function audio(){ if(muted)return null; if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.5; master.connect(AC.destination); }catch(e){ return null; } }
  if(AC.state==='suspended')AC.resume(); return AC; }
function tone(f,dur,o={}){ if(!audio())return; const t=AC.currentTime+(o.delay||0), os=AC.createOscillator(), g=AC.createGain();
  os.type=o.type||'sine'; os.frequency.setValueAtTime(f,t); if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(o.vol||.2,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  os.connect(g); g.connect(master); os.start(t); os.stop(t+dur+.05); }
function noise(dur,f0,f1,vol){ if(!audio())return; const n=AC.sampleRate*dur|0, buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0); for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(), t=AC.currentTime; s.buffer=buf; f.type='lowpass'; f.Q.value=3;
  f.frequency.setValueAtTime(f0,t); f.frequency.exponentialRampToValueAtTime(f1,t+dur); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.15); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); }
const SND={
  bell(){ [1,2.02,2.76,4.07,5.43].forEach((m,i)=>tone(98*m,5.5-i*.8,{vol:.26/(i+1)})); tone(60,.25,{type:'triangle',vol:.3,to:40}); },
  lantern(on){ tone(on?660:440,.18,{vol:.12,to:on?990:300}); },
  greet(){ tone(520,.12,{type:'triangle',vol:.12}); tone(780,.16,{type:'triangle',vol:.12,delay:.11}); },
  roar(){ noise(2,1400,160,.5); tone(110,1.8,{type:'sawtooth',vol:.14,to:42}); tone(73,2,{type:'square',vol:.06,to:36}); },
  plop(){ tone(480,.22,{vol:.2,to:120}); tone(900,.1,{vol:.07,to:500,delay:.08}); },
  petals(){ [1320,1760,1568,2093].forEach((f,i)=>tone(f,.5,{vol:.05,delay:i*.07})); },
  tok(){ if(AC&&!muted)tone(380,.09,{type:'triangle',vol:.1,to:200}); },
  chime(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,1.2,{vol:.1,delay:i*.12})); }
};

/* ================= 交互 ================= */
const found=new Set();
function discover(k){ if(found.has(k))return; found.add(k); const li=document.querySelector('#found li[data-k="'+k+'"]'); if(li)li.classList.add('on'); $('cnt').textContent=found.size+'/6';
  if(found.size===6)setTimeout(()=>{ toast('庭 中 秘 事 · 尽 数 寻 得'); SND.chime(); cherries.forEach(c=>burstPetals(c,26)); DR.fireT=3.5; },700); }
function toast(s){ const el=$('toast'); el.textContent=s; el.style.opacity=1; clearTimeout(toast.t); toast.t=setTimeout(()=>el.style.opacity=0,3800); }
function dragonFire(){ if(DR.fireT>0)return; DR.fireT=2.8; SND.roar(); discover('dragon'); }
function act(hit){ const d=hit.object.userData;
  if(d.type==='lantern'){ d.ref.on=!d.ref.on; SND.lantern(d.ref.on); discover('lantern'); }
  else if(d.type==='villager'){ const v=d.ref; v.greetT=1.6; say(v,v.mode==='sweep'?'阿弥陀佛，落叶扫不尽呀':v.mode==='fish'?'嘘……鱼要上钩了':v.mode==='boat'?'今日风平浪静，好行船！':pick(LINES)); SND.greet(); discover('villager'); }
  else if(d.type==='dragon') dragonFire();
  else if(d.type==='cherry'){ burstPetals(d.ref,70); SND.petals(); discover('cherry'); }
  else if(d.type==='bell'){ bell.t=0; SND.bell(); villagers.forEach(v=>{ if(v.mode==='walk'||v.mode==='sweep')v.bowT=2.4; }); discover('bell'); }
  else if(d.type==='pond'){ const p=hit.point; ripple(p.x,p.z); ripple(p.x,p.z,.25); ripple(p.x,p.z,.5); food.on=5; food.x=clamp(p.x,POND.x-6.5,POND.x+6.5); food.z=clamp(p.z,POND.z-4,POND.z+4); SND.plop(); discover('pond'); }
}
function updateBell(dt){ bell.t+=dt; const k=bell.t; bell.g.rotation.x=k<8?Math.sin(k*3.2)*.16*Math.exp(-k*.6):0;
  bell.log.position.z=BELL.z+2.6-(k<.5?Math.sin(k/.5*Math.PI)*1.3:0); }
function updateShishi(dt){ shishi.t+=dt; const c=shishi.t%5.5; let r;
  if(c<4)r=-.32+c*.05; else if(c<4.25)r=lerp(-.12,.5,(c-4)/.25); else if(c<4.9)r=.5; else r=lerp(.5,-.32,(c-4.9)/.2);
  if(c>=4.9&&!shishi.hit){ shishi.hit=true; SND.tok(); } if(c<1)shishi.hit=false; shishi.tube.rotation.x=clamp(r,-.32,.5); }

/* 相机轨道控制 */
const cam={th:.72,ph:1.16,r:138,tx:-2,ty:6,tz:-1,vth:0,vph:0,spin:true,follow:false};
function applyCam(){ const sp=Math.sin(cam.ph); camera.position.set(cam.tx+cam.r*sp*Math.sin(cam.th),cam.ty+cam.r*Math.cos(cam.ph),cam.tz+cam.r*sp*Math.cos(cam.th)); camera.lookAt(cam.tx,cam.ty,cam.tz); }
const ptrs=new Map(); let moved=0, pinch=0, hoverDirty=false, mx=0, my=0, idle=0;
const ray=new T.Raycaster(), ndc=new T.Vector2();
function pickAt(x,y){ ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1); ray.setFromCamera(ndc,camera); return ray.intersectObjects(pickables,false)[0]; }
canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button,sh:e.shiftKey}); moved=0; idle=0;
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch=Math.hypot(a.x-b.x,a.y-b.y); } $('hint').style.opacity=0; });
canvas.addEventListener('pointermove',e=>{ mx=e.clientX; my=e.clientY; const p=ptrs.get(e.pointerId);
  if(!p){ hoverDirty=true; return; }
  const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY; moved+=Math.abs(dx)+Math.abs(dy); idle=0;
  if(cam.follow)return;
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()], d=Math.hypot(a.x-b.x,a.y-b.y); if(pinch)cam.r=clamp(cam.r*pinch/d,34,210); pinch=d; return; }
  if(p.b===2||p.sh){ const s=cam.r*.0012, c=Math.cos(cam.th), sn=Math.sin(cam.th);
    cam.tx=clamp(cam.tx-(dx*c+dy*sn*.6)*s,-40,40); cam.tz=clamp(cam.tz+(dx*sn-dy*c*.6)*s,-40,40); cam.ty=clamp(cam.ty+dy*s*.5,-20,40); }
  else { cam.vth=-dx*.0055; cam.vph=-dy*.0045; cam.th+=cam.vth; cam.ph=clamp(cam.ph+cam.vph,.18,2.25); } });
function up(e){ const p=ptrs.get(e.pointerId); ptrs.delete(e.pointerId); pinch=0; if(p&&moved<7&&e.type==='pointerup'){ const h=pickAt(e.clientX,e.clientY); if(h)act(h); } }
canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
canvas.addEventListener('pointerleave',()=>{ $('tip').style.opacity=0; });
canvas.addEventListener('wheel',e=>{ e.preventDefault(); cam.r=clamp(cam.r*Math.exp(e.deltaY*.0011),34,210); idle=0; },{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
function updateHover(){ if(!hoverDirty)return; hoverDirty=false; const h=pickAt(mx,my), tip=$('tip');
  if(h){ canvas.style.cursor='pointer'; tip.textContent=h.object.userData.tip; tip.style.opacity=1;
    tip.style.transform='translate('+Math.min(mx+16,innerWidth-tip.offsetWidth-8)+'px,'+(my+18)+'px)'; }
  else{ canvas.style.cursor='grab'; tip.style.opacity=0; } }

function setFollow(v){ cam.follow=v; $('bFollow').classList.toggle('on',v); if(!v)applyCam(); }
function setSpin(v){ cam.spin=v; $('bSpin').classList.toggle('on',v); }
function setMute(v){ muted=v; $('bSound').classList.toggle('on',!v); if(master)master.gain.value=v?0:.5; }
$('bNight').onclick=()=>{ todGoal=nf>.5?12:22; };
$('bFlow').onclick=()=>setFlow(!flow);
$('tod').addEventListener('input',e=>setTime(+e.target.value));
document.querySelectorAll('#presets button').forEach(b=>b.onclick=()=>{ todGoal=+b.dataset.h; });
$('bFire').onclick=dragonFire; $('bFollow').onclick=()=>setFollow(!cam.follow); $('bSpin').onclick=()=>setSpin(!cam.spin); $('bSound').onclick=()=>setMute(!muted);
addEventListener('keydown',e=>{ if(e.repeat||e.target.tagName==='BUTTON'&&e.code==='Space'||e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='n')$('bNight').click(); else if(k==='t')$('bFlow').click(); else if(k==='f')$('bFollow').click(); else if(k==='r')$('bSpin').click(); else if(k==='m')$('bSound').click(); else if(e.code==='Space'){ e.preventDefault(); dragonFire(); } });
function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.fov=innerWidth<innerHeight?52:38; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();

/* ================= 主循环 ================= */
const clock=new T.Clock(); let time=0; const cT=new V3(), cL=new V3();
function frame(){ requestAnimationFrame(frame);
  const dt=Math.min(.05,clock.getDelta()); time+=dt; idle+=dt; updateFall(dt,time); cloudSea.rotation.y+=dt*.006;
  updateDayNight(dt,time); updateDragon(dt,time); updateVillagers(dt,time); updateKoi(dt,time); updateFire(dt); updatePetals(dt,time);
  updateFlies(time,nf); updateRipples(dt); updateBell(dt); updateShishi(dt);
  for(const c of clouds){ c.position.x+=c.userData.s*dt; if(c.position.x>170)c.position.x=-170; }
  if(cam.follow){ cT.copy(dHead).addScaledVector(dDir,-20); cT.y+=8; camera.position.lerp(cT,Math.min(1,dt*3)); cL.copy(dHead).addScaledVector(dDir,8); camera.lookAt(cL); }
  else { if(ptrs.size===0){ cam.th+=cam.vth; cam.ph=clamp(cam.ph+cam.vph,.18,2.25); cam.vth*=.9; cam.vph*=.9; if(cam.spin&&idle>2.5)cam.th+=dt*.035; } applyCam(); }
  updateHover(); renderer.render(scene,camera);
}
setTime(9.5); applyCam(); canvas.style.cursor='grab';
frame();
const ld=$('load'); ld.style.opacity=0; setTimeout(()=>ld.remove(),900); setTimeout(()=>$('hint').style.opacity=0,9000);
window.__garden={scene,camera,DR,villagers,lanterns,setTime,pickables,cam,found};
}
</script>
</body>
