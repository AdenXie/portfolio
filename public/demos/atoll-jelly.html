<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>环礁果冻 · 材质研究</title>

<style>
:root{--paper:#ece9e3;--ink:#241f1d;--teal:#12a2a6;--mute:rgba(36,31,29,.52);--hair:rgba(36,31,29,.14);
--serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans);overscroll-behavior:none}
body{position:fixed;inset:0;user-select:none;-webkit-user-select:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.drag{cursor:grabbing}
.mast{position:absolute;left:clamp(20px,4vw,56px);top:clamp(18px,4vh,46px);max-width:330px;pointer-events:none}
.eye{font-size:11px;letter-spacing:.42em;color:var(--mute);display:flex;align-items:center;gap:12px}
.eye::before{content:"";width:26px;height:1px;background:var(--ink);opacity:.5}
h1{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(46px,6.4vw,88px);line-height:1.02;letter-spacing:.02em;margin:16px 0 18px;transform:skewX(-6deg);transform-origin:left bottom}
h1 em{font-style:inherit;color:var(--teal)}
.dek{font-size:13.5px;line-height:1.85;color:rgba(36,31,29,.74);max-width:270px}
.pill{display:inline-flex;align-items:center;gap:9px;margin-top:20px;padding:6px 13px 6px 11px;border:1px solid var(--hair);border-radius:99px;font-size:10.5px;letter-spacing:.2em;background:rgba(255,255,255,.35)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px rgba(18,162,166,.18)}
.pill.off i{background:#b9443a;box-shadow:0 0 0 3px rgba(185,68,58,.16)}
.pill.hold i{background:#c69a2e;box-shadow:0 0 0 3px rgba(198,154,46,.18)}
#panel{position:absolute;right:clamp(14px,2.4vw,34px);top:50%;transform:translateY(-50%);width:262px;padding:18px 18px 16px;border-radius:20px;
background:rgba(246,243,238,.58);-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);
border:1px solid rgba(255,255,255,.7);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 24px 60px -28px rgba(36,31,29,.4)}
#grip{display:none}
.sec{font-size:10.5px;letter-spacing:.34em;color:var(--mute);margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{letter-spacing:.08em;font-size:10px;font-variant-numeric:tabular-nums}
.sec+*{margin-bottom:0}
.grp{margin-bottom:16px}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
.dark{background:var(--ink);color:#f3efe8;border-radius:11px;padding:11px 2px;font-size:12px;letter-spacing:.06em;transition:transform .12s,background .2s}
.dark:hover{background:#3a322f}.dark:active{transform:scale(.95)}
.bar{height:2px;background:var(--hair);border-radius:2px;margin:12px 0 9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--teal);border-radius:2px}
.cnt{font-size:11.5px;color:rgba(36,31,29,.7);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.cnt b{font-family:var(--serif);font-style:italic;font-weight:600;font-size:15px;color:var(--ink);margin:0 1px 0 3px}
.cnt span{opacity:.4;margin:0 5px}
.sw{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.sw button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 7px;border-radius:11px;font-size:11px;letter-spacing:.08em;border:1px solid transparent;color:rgba(36,31,29,.72)}
.sw button i{width:26px;height:26px;border-radius:9px;box-shadow:inset 0 -5px 8px rgba(0,0,0,.14),inset 0 3px 4px rgba(255,255,255,.55)}
.sw button.on{border-color:var(--hair);background:rgba(255,255,255,.55);color:var(--ink)}
.sl{display:grid;grid-template-columns:62px 1fr 44px;align-items:center;gap:8px;font-size:11.5px;margin:9px 0}
.sl output{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute);font-size:11px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(36,31,29,.22);border-radius:2px}
input[type=range]::-moz-range-track{height:2px;background:rgba(36,31,29,.22);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);margin-top:-6px}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.foot{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:6px;margin-top:14px}
.foot button{border:1px solid rgba(36,31,29,.24);border-radius:10px;padding:8px 0;font-size:11.5px;letter-spacing:.05em;transition:background .2s}
.foot button:hover{background:rgba(255,255,255,.6)}
.how{position:absolute;left:clamp(20px,4vw,56px);bottom:clamp(16px,4vh,40px);max-width:400px;pointer-events:none}
.how h2{font-size:10.5px;font-weight:400;letter-spacing:.42em;color:var(--mute);margin-bottom:8px}
.how p{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.6}
.how small{display:block;margin-top:7px;font-size:11px;color:var(--mute);letter-spacing:.03em;line-height:1.7}
#fb{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;padding:20px}
#fb.on{display:flex}
#fb div{pointer-events:auto;max-width:380px;padding:26px 28px;border-radius:20px;background:rgba(250,248,244,.92);border:1px solid var(--hair);box-shadow:0 30px 70px -30px rgba(36,31,29,.45)}
#fb h3{font-family:var(--serif);font-style:italic;font-size:24px;font-weight:500;margin-bottom:10px}
#fb p{font-size:13px;line-height:1.8;color:rgba(36,31,29,.75)}
#fb code{font-size:11px;color:var(--mute);display:block;margin-top:10px;word-break:break-all}
@media (max-width:760px){
 .mast{max-width:62vw}.dek{display:none}.pill{margin-top:10px}h1{margin:10px 0 0}
 .how{display:none}
 #panel{left:8px;right:8px;top:auto;bottom:0;width:auto;transform:translateY(calc(100% - 148px - env(safe-area-inset-bottom)));border-radius:22px 22px 0 0;padding:6px 16px calc(14px + env(safe-area-inset-bottom));transition:transform .34s cubic-bezier(.3,.9,.3,1);max-height:86vh;overflow:hidden}
 #panel.open{transform:none}
 #grip{display:block;width:100%;height:24px;position:relative}
 #grip::after{content:"";position:absolute;left:50%;top:9px;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:rgba(36,31,29,.25)}
}
@media (max-height:560px) and (min-width:761px){#panel{transform:translateY(-50%) scale(.82);transform-origin:right center}.how small{display:none}}
</style>

<body>
<canvas id="c"></canvas>
<header class="mast">
  <div class="eye">材质研究</div>
  <h1>环礁<br>果冻<em>。</em></h1>
  <p class="dek">六座高脚水上屋，一架来来去去的水上飞机，还有在下方果冻里滑行的鹞鲼。</p>
  <div class="pill" id="pill"><i></i><span id="pillT">WEBGPU · 启动中</span></div>
</header>
<aside id="panel">
  <button id="grip" aria-label="展开控制面板"></button>
  <div class="grp">
    <div class="sec">泻湖<small id="phase">等待</small></div>
    <div class="acts">
      <button class="dark" id="bPlane">水上飞机</button>
      <button class="dark" id="bFeed">喂鱼</button>
      <button class="dark" id="bRing">放游泳圈</button>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="cnt">降落<b id="nLand">0</b><span>·</span>已喂<b id="nFed">0</b><span>·</span>漂浮中<b id="nFloat">0</b></div>
  </div>
  <div class="grp">
    <div class="sec">口味</div>
    <div class="sw" id="sw">
      <button class="on" data-f="0"><i style="background:#2fc9c2"></i>青绿</button>
      <button data-f="1"><i style="background:#2a6fe0"></i>宝石蓝</button>
      <button data-f="2"><i style="background:#a5d63a"></i>青柠</button>
    </div>
  </div>
  <div class="grp" style="margin-bottom:0">
    <label class="sl">硬度<input type="range" id="sHard" min="0" max="100" value="40"><output id="oHard">40</output></label>
    <label class="sl">波浪阻尼<input type="range" id="sDamp" min="0" max="100" value="30"><output id="oDamp">30</output></label>
    <label class="sl">潮位<input type="range" id="sTide" min="-10" max="10" value="0" step="0.5"><output id="oTide">0 cm</output></label>
  </div>
  <div class="foot">
    <button id="bReset">重置</button><button id="bPause">暂停</button><button id="bView">重置视角</button>
  </div>
</aside>
<footer class="how">
  <h2>玩法</h2>
  <p>搅动泻湖。喂喂鱼。挥手送水上飞机起飞。</p>
  <small>拖水面搅动 · 拖方块侧壁倾斜 · 拖空白处环绕 · 滚轮或双指缩放 · 游泳圈可以拿起来扔 · 点飞机催它出发</small>
</footer>
<div id="fb"><div><h3>这块果冻需要 WebGPU。</h3><p>当前浏览器或显卡没有提供 WebGPU，所以画面无法渲染。请换用新版 Chrome、Edge 或 Safari，并确认已开启硬件加速。模拟本身仍在后台运行。</p><code id="fbWhy"></code></div></div>
<script>
'use strict';
/* ============ 环礁果冻 Atoll Jelly ============ */
const TAU=Math.PI*2,HALF=2.6,SIZE=5.2,SEA0=1.3,N=168,DX=SIZE/N,DECK=1.445;
const clamp=(x,a,b)=>x<a?a:x>b?b:x,lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
const angd=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d};
const approach=(v,t,m)=>v<t?Math.min(t,v+m):Math.max(t,v-m);
let _seed=20261116;
function rnd(){_seed=(_seed+0x6D2B79F5)|0;let t=Math.imul(_seed^(_seed>>>15),1|_seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}
const rr=(a,b)=>a+(b-a)*rnd();
function h2(i,j){let n=Math.imul(i,374761393)+Math.imul(j,668265263)|0;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296}
function vnoise(x,y){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  return lerp(lerp(h2(i,j),h2(i+1,j),u),lerp(h2(i,j+1),h2(i+1,j+1),u),v)}

/* ---------- mat4 (column-major) ---------- */
function mIdent(){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m}
function mMul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++){const b0=b[c*4],b1=b[c*4+1],b2=b[c*4+2],b3=b[c*4+3];
  o[c*4]=a[0]*b0+a[4]*b1+a[8]*b2+a[12]*b3;o[c*4+1]=a[1]*b0+a[5]*b1+a[9]*b2+a[13]*b3;o[c*4+2]=a[2]*b0+a[6]*b1+a[10]*b2+a[14]*b3;o[c*4+3]=a[3]*b0+a[7]*b1+a[11]*b2+a[15]*b3}return o}
function mTrans(x,y,z){const m=mIdent();m[12]=x;m[13]=y;m[14]=z;return m}
function mScale(s){const m=mIdent();m[0]=m[5]=m[10]=s;return m}
function mRotX(a){const m=mIdent(),c=Math.cos(a),s=Math.sin(a);m[5]=c;m[6]=s;m[9]=-s;m[10]=c;return m}
function mRotY(a){const m=mIdent(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[2]=-s;m[8]=s;m[10]=c;return m}
function mRotZ(a){const m=mIdent(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[1]=s;m[4]=-s;m[5]=c;return m}
/* local +x forward -> world heading psi (cos,0,sin); pitch nose-up; roll right-wing-down */
function mPose(x,y,z,psi,pitch,roll,s){let m=mMul(mTrans(x,y,z),mRotY(-psi));if(pitch)m=mMul(m,mRotZ(pitch));if(roll)m=mMul(m,mRotX(roll));if(s!==undefined&&s!==1)m=mMul(m,mScale(s));return m}
function mPersp(fovy,asp,n,f){const m=new Float32Array(16),t=1/Math.tan(fovy/2);m[0]=t/asp;m[5]=t;m[10]=f/(n-f);m[11]=-1;m[14]=n*f/(n-f);return m}
function mOrtho(l,r,b,t,n,f){const m=mIdent();m[0]=2/(r-l);m[5]=2/(t-b);m[10]=1/(n-f);m[12]=-(r+l)/(r-l);m[13]=-(t+b)/(t-b);m[14]=n/(n-f);return m}
function mLook(e,t,u){let zx=e[0]-t[0],zy=e[1]-t[1],zz=e[2]-t[2];let l=Math.hypot(zx,zy,zz);zx/=l;zy/=l;zz/=l;
  let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz);xx/=l;xy/=l;xz/=l;
  const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;const m=new Float32Array(16);
  m[0]=xx;m[1]=yx;m[2]=zx;m[4]=xy;m[5]=yy;m[6]=zy;m[8]=xz;m[9]=yz;m[10]=zz;
  m[12]=-(xx*e[0]+xy*e[1]+xz*e[2]);m[13]=-(yx*e[0]+yy*e[1]+yz*e[2]);m[14]=-(zx*e[0]+zy*e[1]+zz*e[2]);m[15]=1;return m}
function mInv(m){const o=new Float32Array(16),a00=m[0],a01=m[1],a02=m[2],a03=m[3],a10=m[4],a11=m[5],a12=m[6],a13=m[7],a20=m[8],a21=m[9],a22=m[10],a23=m[11],a30=m[12],a31=m[13],a32=m[14],a33=m[15];
  const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,b03=a01*a12-a02*a11,b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,b08=a20*a33-a23*a30,b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
  let d=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;d=1/(d||1e-20);
  o[0]=(a11*b11-a12*b10+a13*b09)*d;o[1]=(a02*b10-a01*b11-a03*b09)*d;o[2]=(a31*b05-a32*b04+a33*b03)*d;o[3]=(a22*b04-a21*b05-a23*b03)*d;
  o[4]=(a12*b08-a10*b11-a13*b07)*d;o[5]=(a00*b11-a02*b08+a03*b07)*d;o[6]=(a32*b02-a30*b05-a33*b01)*d;o[7]=(a20*b05-a22*b02+a23*b01)*d;
  o[8]=(a10*b10-a11*b08+a13*b06)*d;o[9]=(a01*b08-a00*b10-a03*b06)*d;o[10]=(a30*b04-a31*b02+a33*b00)*d;o[11]=(a21*b02-a20*b04-a23*b00)*d;
  o[12]=(a11*b07-a10*b09-a12*b06)*d;o[13]=(a00*b09-a01*b07+a02*b06)*d;o[14]=(a31*b01-a30*b03-a32*b00)*d;o[15]=(a20*b03-a21*b01+a22*b00)*d;return o}
function mPoint(m,x,y,z){const w=m[3]*x+m[7]*y+m[11]*z+m[15];return[(m[0]*x+m[4]*y+m[8]*z+m[12])/w,(m[1]*x+m[5]*y+m[9]*z+m[13])/w,(m[2]*x+m[6]*y+m[10]*z+m[14])/w]}

/* ---------- terrain ---------- */
const ISLE={x:-1.42,z:-1.38,r:1.0},HOLE={x:1.52,z:1.48,r:1.02};
const MOUNDS=[[0.3,0.62,0.36,0.09],[-0.6,2.0,0.3,0.08],[0.95,-1.6,0.36,0.09],[2.05,-1.25,0.3,0.085],[-2.05,0.85,0.3,0.085],[0.1,-2.12,0.3,0.08],[2.15,0.4,0.28,0.08],[-0.25,1.25,0.26,0.075]];
function isleT(x,z){const dx=x-ISLE.x,dz=z-ISLE.z,a=Math.atan2(dz,dx);return Math.hypot(dx,dz)/(ISLE.r*(1+0.07*Math.sin(3*a+1)+0.04*Math.sin(5*a+2.3)))}
function isleF(x,z){return 1-sstep(0.74,1.32,isleT(x,z))}
function moundF(x,z){let f=0;for(const m of MOUNDS){const d=Math.hypot(x-m[0],z-m[1])/m[2];if(d<1){const c=Math.cos(d*Math.PI*0.5);f=Math.max(f,c*c)}}return f}
function terrainH(x,z){
  let h=1.0+0.03*(vnoise(x*1.1+7,z*1.1+3)-0.5)+0.0035*Math.sin((x*0.8+z)*30+vnoise(x*2,z*2)*5);
  const dh=Math.hypot(x-HOLE.x,z-HOLE.z)/HOLE.r;
  h-=0.72*(1-sstep(0.16,0.96,dh))+0.07*(1-sstep(0.7,1.7,dh));
  for(const m of MOUNDS){const d=Math.hypot(x-m[0],z-m[1])/m[2];if(d<1){const c=Math.cos(d*Math.PI*0.5);h+=m[3]*c*c*(0.85+0.3*vnoise(x*9,z*9))}}
  const t=isleT(x,z);
  if(t<1.35){const f=1-sstep(0.74,1.32,t);h=lerp(h,1.475+0.012*vnoise(x*6,z*6),f);
    const dk=Math.hypot(x+1.8,z+1.74);h+=0.21*(1-sstep(0,0.62,dk))*f}
  return h}

/* ---------- shallow water: staggered (MAC) grid, linear ---------- */
const SIM={sea:SEA0,tide:0,hard:0.4,damp:0.3,gE:5,ax:0,az:0,energy:0,maxEta:0,foamSum:0,ms:0,msAvg:0,msMax:0,steps:0};
const HSTEP=1/120,C2MAX=Math.pow(0.5*DX/HSTEP,2),SIGMA=2e-4;
const eta=new Float32Array(N*N),foam=new Float32Array(N*N),terr=new Float32Array(N*N),depth=new Float32Array(N*N),Pr=new Float32Array(N*N);
const wet=new Uint8Array(N*N);
const U=new Float32Array((N+1)*N),dU=new Float32Array((N+1)*N),sU=new Float32Array((N+1)*N);
const V=new Float32Array(N*(N+1)),dV=new Float32Array(N*(N+1)),sV=new Float32Array(N*(N+1));
for(let j=0;j<N;j++)for(let i=0;i<N;i++)terr[j*N+i]=terrainH(-HALF+(i+0.5)*DX,-HALF+(j+0.5)*DX);
function simConfigure(){
  SIM.sea=SEA0+SIM.tide;SIM.gE=4.8*(0.5+1.5*SIM.hard);
  const cap=C2MAX/SIM.gE;
  for(let k=0;k<N*N;k++){const d=SIM.sea-terr[k];depth[k]=d;wet[k]=d>0.012?1:0;if(!wet[k]){eta[k]=0;foam[k]=0}}
  for(let j=0;j<N;j++)for(let i=0;i<=N;i++){const f=j*(N+1)+i;
    if(i===0||i===N){dU[f]=0;U[f]=0;continue}const k=j*N+i;
    if(wet[k]&&wet[k-1]){const dm=0.5*(depth[k]+depth[k-1]);dU[f]=Math.min(dm,cap);sU[f]=1-sstep(0.02,0.1,dm)}else{dU[f]=0;U[f]=0}}

/* ================= world logic ================= */
const ST={time:0,paused:false,fed:0,flavor:0,stress:0};
const scares=[];

const parts=[];

function updParts(dt){for(let k=parts.length-1;k>=0;k--){const p=parts[k];p.life-=dt;
    if(p.type===0){p.vy-=5.5*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
      if(p.vy<0&&Math.abs(p.x)<HALF&&Math.abs(p.z)<HALF){const wy=Math.max(waterY(p.x,p.z),terrainH(p.x,p.z));if(p.y<wy){if(isWet(p.x,p.z)){addFoam(p.x,p.z,0.03,0.12);splat(p.x,p.z,0.03,-0.002)}p.life=0}}

/* ---------- reef fish (boids) ---------- */
const fish=[],FISH_N=[12,11,10,9];

function fishCheck(){let viol=0,minSurf=9,minBot=9,minDepth=9;for(const f of fish){const th=terrainH(f.x,f.z),sy=waterY(f.x,f.z);

/* ---------- spotted eagle rays ---------- */

/* ---------- fish food ---------- */

/* ---------- pool rings ---------- */

  const pWater=device.createRenderPipeline({layout:device.createPipelineLayout({bindGroupLayouts:[bglWater]}),vertex:{module:mWater,entryPoint:'vs',buffers:[{arrayStride:16,attributes:[{shaderLocation:0,offset:0,format:f4}]}]},
    fragment:{module:mWater,entryPoint:'fs',targets:[{format:fmt}]},primitive:prim,depthStencil:{format:'depth24plus',depthWriteEnabled:true,depthCompare:'less'},multisample:{count:4}});
  const bgShadow=device.createBindGroup({layout:bglShadow,entries:[{binding:0,resource:{buffer:ubuf}}]});
  const bgScene=device.createBindGroup({layout:bglScene,entries:[{binding:0,resource:{buffer:ubuf}},{binding:1,resource:shView},{binding:2,resource:cmpS},{binding:3,resource:simView},{binding:4,resource:linS}]});
  let tw=0,th=0,colV,depV,msV,msDV,bgWater,texs=[];
  function resize(){const dpr=Math.min(window.devicePixelRatio||1,2),w=Math.max(2,Math.floor(canvas.clientWidth*dpr)),h=Math.max(2,Math.floor(canvas.clientHeight*dpr));
    if(w===tw&&h===th)return;tw=w;th=h;canvas.width=w;canvas.height=h;for(const t of texs)t.destroy();
    const RA=GPUTextureUsage.RENDER_ATTACHMENT,TB=GPUTextureUsage.TEXTURE_BINDING;
    const a=device.createTexture({size:[w,h],format:'rgba8unorm',usage:RA|TB}),b=device.createTexture({size:[w,h],format:'depth32float',usage:RA|TB}),
      c=device.createTexture({size:[w,h],format:fmt,sampleCount:4,usage:RA}),d=device.createTexture({size:[w,h],format:'depth24plus',sampleCount:4,usage:RA});
    texs=[a,b,c,d];colV=a.createView();depV=b.createView();msV=c.createView();msDV=d.createView();
    bgWater=device.createBindGroup({layout:bglWater,entries:[{binding:0,resource:{buffer:ubuf}},{binding:1,resource:colV},{binding:2,resource:depV},{binding:3,resource:simView},{binding:4,resource:linS},{binding:5,resource:shView},{binding:6,resource:cmpS}]})}
  const paper={r:0.9255,g:0.9137,b:0.8902,a:1};
  function drawAll(p,shadowOnly){p.setVertexBuffer(0,vbuf);p.setVertexBuffer(1,instBuf);p.setIndexBuffer(ibuf,'uint32');
    for(const d of draws){if(shadowOnly&&!d.shadow)continue;const m=MESH[d.name];p.drawIndexed(m.count,d.count,m.first,m.base,d.first)}}
  GPU.frame=function(){
    resize();updateView(canvas.clientWidth,canvas.clientHeight);buildFrame();packSim();
    for(let k=0;k<3;k++){const tg=FLAVORS[ST.flavor];FL.sig[k]+=(tg.sig[k]-FL.sig[k])*0.08;FL.sc[k]+=(tg.sc[k]-FL.sc[k])*0.08}
    udata.set(VIEW.vp,0);udata.set(LVP,16);udata.set(VIEW.ivp,32);
    udata.set([VIEW.eye[0],VIEW.eye[1],VIEW.eye[2],ST.time%3600],48);udata.set([SUN[0],SUN[1],SUN[2],0],52);
    udata.set([FL.sig[0],FL.sig[1],FL.sig[2],0],56);udata.set([FL.sc[0],FL.sc[1],FL.sc[2],0],60);udata.set([tw,th,SIM.sea,0],64);
    device.queue.writeBuffer(ubuf,0,udata);
    device.queue.writeBuffer(instBuf,0,instData,0,Math.max(24,instN*24));
    device.queue.writeTexture({texture:simTex},simHalf,{bytesPerRow:N*8},{width:N,height:N});
    const enc=device.createCommandEncoder();
    let p=enc.beginRenderPass({colorAttachments:[],depthStencilAttachment:{view:shView,depthClearValue:1,depthLoadOp:'clear',depthStoreOp:'store'}});

    p=enc.beginRenderPass({colorAttachments:[{view:colV,clearValue:paper,loadOp:'clear',storeOp:'store'}],depthStencilAttachment:{view:depV,depthClearValue:1,depthLoadOp:'clear',depthStoreOp:'store'}});
    p.setPipeline(pSceneOff);p.setBindGroup(0,bgScene);drawAll(p,false);p.end();
    p=enc.beginRenderPass({colorAttachments:[{view:msV,resolveTarget:ctx.getCurrentTexture().createView(),clearValue:paper,loadOp:'clear',storeOp:'discard'}],depthStencilAttachment:{view:msDV,depthClearValue:1,depthLoadOp:'clear',depthStoreOp:'discard'}});
    p.setPipeline(pSceneMS);p.setBindGroup(0,bgScene);drawAll(p,false);
    p.setPipeline(pWater);p.setBindGroup(0,bgWater);p.setVertexBuffer(0,wvbuf);p.setIndexBuffer(wibuf,'uint32');p.drawIndexed(wCount);p.end();
    device.queue.submit([enc.finish()])};
  GPU.ok=true;return true}

/* ================= interaction, UI, QA hook ================= */
const $=id=>document.getElementById(id),canvas=$('c');
const STATIC_MESH=buildStatic();
function showFallback(){$('fb').classList.add('on');$('fbWhy').textContent=GPU.why||'';$('pill').className='pill off';$('pillT').textContent='WEBGPU · 不可用'}
function rayAt(cx,cy){const r=canvas.getBoundingClientRect(),nx=(cx-r.left)/r.width*2-1,ny=1-(cy-r.top)/r.height*2,a=mPoint(VIEW.ivp,nx,ny,0),b=mPoint(VIEW.ivp,nx,ny,1);
  const dx=b[0]-a[0],dy=b[1]-a[1],dz=b[2]-a[2],l=Math.hypot(dx,dy,dz)||1;return{o:a,d:[dx/l,dy/l,dz/l]}}
function hitY(ray,y){if(Math.abs(ray.d[1])<1e-5)return null;const t=(y-ray.o[1])/ray.d[1];if(t<0)return null;return[ray.o[0]+ray.d[0]*t,y,ray.o[2]+ray.d[2]*t]}
function sphereHit(ray,c,r){const ox=c[0]-ray.o[0],oy=c[1]-ray.o[1],oz=c[2]-ray.o[2],t=ox*ray.d[0]+oy*ray.d[1]+oz*ray.d[2];if(t<0)return null;
  const d2=ox*ox+oy*oy+oz*oz-t*t;return d2<r*r?t:null}
function pick(ray){const o=ray.o,d=ray.d,lo=[-HALF,0,-HALF],hi=[HALF,SIM.sea,HALF];let t0=-1e9,t1=1e9,ax=-1,miss=false;
  for(let k=0;k<3;k++){if(Math.abs(d[k])<1e-6){if(o[k]<lo[k]||o[k]>hi[k])miss=true;continue}let a=(lo[k]-o[k])/d[k],b=(hi[k]-o[k])/d[k];if(a>b){const s=a;a=b;b=s}if(a>t0){t0=a;ax=k}if(b<t1)t1=b}
  let best={mode:'orbit',t:1e9};
  if(!miss&&t0<=t1&&t0>0){const p=[o[0]+d[0]*t0,o[1]+d[1]*t0,o[2]+d[2]*t0];
    if(ax===1)best=isWet(p[0],p[2])?{mode:'stir',t:t0,p}:{mode:'orbit',t:t0};else best={mode:'tilt',t:t0,p}}
  let rb=null;rings.forEach((r,i)=>{const t=sphereHit(ray,[r.x,r.y,r.z],0.2);if(t!==null&&(!rb||t<rb.t))rb={mode:'ring',t,i}});
  if(rb&&rb.t<best.t+0.3)return rb;
  const tp=sphereHit(ray,[PL.x,PL.y+0.16,PL.z],0.36);if(tp!==null&&tp<best.t+0.25)return{mode:'plane',t:tp};
  return best}
const ptrs=new Map();let drag=null,pinch=null;
function endDrag(cancel){if(!drag)return;const g=drag;drag=null;canvas.classList.remove('drag');
  if(g.mode==='ring'&&g.ring){const r=g.ring;r.held=false;r.air=true;r.vx=clamp(g.vel[0]*0.9,-4,4);r.vz=clamp(g.vel[2]*0.9,-4,4);r.vy=0.4+Math.min(1.6,Math.hypot(g.vel[0],g.vel[2])*0.25);r.spin=rr(-4,4)}
  if(g.mode==='tilt')TILT.held=false;
  if(g.mode==='plane'&&g.moved<7&&!cancel)seaplaneAction()}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){endDrag(true);const p=[...ptrs.values()];pinch={d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),cx:(p[0].x+p[1].x)/2,cy:(p[0].y+p[1].y)/2};return}
  if(ptrs.size>2)return;
  updateView(canvas.clientWidth,canvas.clientHeight);
  const h=pick(rayAt(e.clientX,e.clientY));
  drag={id:e.pointerId,mode:h.mode,x:e.clientX,y:e.clientY,moved:0,tm:performance.now(),lp:null,ring:null,vel:[0,0,0]};
  if(h.mode==='stir'){splash(h.p[0],h.p[2],0.45);drag.lp=h.p}
  else if(h.mode==='ring'){const r=rings[h.i];r.held=true;r.vx=r.vy=r.vz=0;drag.ring=r}
  else if(h.mode==='tilt'){TILT.held=true;TILT.tx=TILT.ax;TILT.tz=TILT.az}
  canvas.classList.add('drag')});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(pinch&&ptrs.size>=2){const q=[...ptrs.values()],d=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y),cx=(q[0].x+q[1].x)/2,cy=(q[0].y+q[1].y)/2;
    if(d>4&&pinch.d>4)CAM.dist=clamp(CAM.dist*pinch.d/d,5.5,24);CAM.yaw-=(cx-pinch.cx)*0.006;CAM.pitch=clamp(CAM.pitch+(cy-pinch.cy)*0.005,0.1,1.42);pinch.d=d;pinch.cx=cx;pinch.cy=cy;camGoal=null;return}
  if(!drag||drag.id!==e.pointerId)return;drag.moved+=Math.abs(dx)+Math.abs(dy);
  const now=performance.now(),dtm=clamp((now-drag.tm)/1000,1/240,0.1);drag.tm=now;
  if(drag.mode==='orbit'||drag.mode==='plane'){CAM.yaw-=dx*0.006;CAM.pitch=clamp(CAM.pitch+dy*0.005,0.1,1.42);camGoal=null}
  else if(drag.mode==='stir'){const q=hitY(rayAt(e.clientX,e.clientY),SIM.sea);
    if(q&&isWet(q[0],q[2])){if(drag.lp)stirTo(drag.lp[0],drag.lp[2],q[0],q[2],dtm);drag.lp=q}else drag.lp=null}
  else if(drag.mode==='ring'){const q=hitY(rayAt(e.clientX,e.clientY),SIM.sea+0.42),r=drag.ring;
    if(q&&r){const lim=HALF-0.2,nx=clamp(q[0],-lim,lim),nz=clamp(q[2],-lim,lim),k=0.5;
      drag.vel[0]+=((nx-r.x)/dtm-drag.vel[0])*k;drag.vel[2]+=((nz-r.z)/dtm-drag.vel[2])*k;r.x=nx;r.z=nz;r.y+=(q[1]-r.y)*0.5;r.nx=0;r.ny=1;r.nz=0}}
  else if(drag.mode==='tilt'){const k=0.0011,cy=Math.cos(CAM.yaw),sy=Math.sin(CAM.yaw);
    TILT.tx=clamp(TILT.tx+(cy*dy-sy*dx)*k,-TILT.max,TILT.max);TILT.tz=clamp(TILT.tz+(-sy*dy-cy*dx)*k,-TILT.max,TILT.max)}});
function stirTo(x0,z0,x1,z1,dtm){const vx=clamp((x1-x0)/dtm,-2.5,2.5),vz=clamp((z1-z0)/dtm,-2.5,2.5),sp=Math.min(1,Math.hypot(vx,vz)/1.5);
  impulse(x1,z1,0.14,vx*0.3,vz*0.3);splat(x1,z1,0.085,-0.004-0.007*sp);splat(x1+vx*0.05,z1+vz*0.05,0.1,0.006*sp);addFoam(x1,z1,0.06,0.07*sp);scare(x1,z1,0.6,0.4);
  if(rnd()<0.35)emit(1,x1+rr(-0.04,0.04),waterY(x1,z1)-rr(0.02,0.1),z1+rr(-0.04,0.04),0,rr(0.12,0.26),0,rr(0.4,0.9),rr(0.004,0.009))}
function ptrUp(e){ptrs.delete(e.pointerId);if(pinch){if(ptrs.size<2)pinch=null;return}if(drag&&drag.id===e.pointerId)endDrag(e.type==='pointercancel')}
canvas.addEventListener('pointerup',ptrUp);canvas.addEventListener('pointercancel',ptrUp);
canvas.addEventListener('wheel',e=>{e.preventDefault();CAM.dist=clamp(CAM.dist*Math.exp(e.deltaY*0.0011),5.5,24);camGoal=null},{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());

/* UI */
const CAM0={yaw:CAM.yaw,pitch:CAM.pitch,dist:CAM.dist};let camGoal=null;
function setFlavor(i){ST.flavor=clamp(i|0,0,2);[...$('sw').children].forEach((b,k)=>b.classList.toggle('on',k===ST.flavor))}
function setParam(name,v){if(name==='hard'){SIM.hard=clamp(v,0,1);$('sHard').value=Math.round(SIM.hard*100);$('oHard').textContent=Math.round(SIM.hard*100);simConfigure()}
  else if(name==='damp'){SIM.damp=clamp(v,0,1);$('sDamp').value=Math.round(SIM.damp*100);$('oDamp').textContent=Math.round(SIM.damp*100)}
  else if(name==='tide'){const cm=clamp(v,-10,10);SIM.tide=cm/100;$('sTide').value=cm;$('oTide').textContent=(cm>0?'+':'')+(Math.round(cm*10)/10)+' cm';simConfigure();for(const f of fish){const lo=terrainH(f.x,f.z)+0.035;f.y=clamp(f.y,lo,Math.max(lo,waterY(f.x,f.z)-0.035))}}
  else return false;return true}
function setPaused(b){ST.paused=!!b;$('bPause').textContent=ST.paused?'继续':'暂停';if(GPU.ok){$('pill').className=ST.paused?'pill hold':'pill';$('pillT').textContent=ST.paused?'WEBGPU · 已暂停':'WEBGPU · 运行中'}}
$('bPlane').onclick=()=>seaplaneAction();
$('bFeed').onclick=()=>feed();
$('bRing').onclick=()=>addRing();
$('sw').onclick=e=>{const b=e.target.closest('button');if(b)setFlavor(+b.dataset.f)};
$('sHard').oninput=e=>setParam('hard',e.target.value/100);
$('sDamp').oninput=e=>setParam('damp',e.target.value/100);
$('sTide').oninput=e=>setParam('tide',+e.target.value);
$('bReset').onclick=()=>resetWorld();
$('bPause').onclick=()=>setPaused(!ST.paused);
$('bView').onclick=()=>{camGoal={...CAM0}};
$('grip').onclick=()=>$('panel').classList.toggle('open');
let hudT=0;
function hud(){if(++hudT%6)return;$('nLand').textContent=PL.landings;$('nFed').textContent=ST.fed;$('nFloat').textContent=rings.filter(r=>r.afloat).length;
  $('prog').style.width=(PL.progress*100).toFixed(1)+'%';$('phase').textContent=PHASE_CN[PL.ph]+(PL.boost>1?' · 加速':'')}
let lastT=performance.now(),frames=0;
function tick(now){const dt=clamp((now-lastT)/1000,0,0.05);lastT=now;frames++;
  if(!ST.paused)update(dt);
  if(camGoal){const k=Math.min(1,dt*5);CAM.yaw+=angd(camGoal.yaw,CAM.yaw)*k;CAM.pitch+=(camGoal.pitch-CAM.pitch)*k;CAM.dist+=(camGoal.dist-CAM.dist)*k;
    if(Math.abs(angd(camGoal.yaw,CAM.yaw))+Math.abs(camGoal.pitch-CAM.pitch)+Math.abs(camGoal.dist-CAM.dist)*0.1<0.003){CAM.yaw=camGoal.yaw;CAM.pitch=camGoal.pitch;CAM.dist=camGoal.dist;camGoal=null}}
  if(GPU.ok){try{GPU.frame()}catch(e){GPU.ok=false;GPU.why=String(e&&e.message||e);showFallback()}}
  else updateView(canvas.clientWidth||1,canvas.clientHeight||1);
  hud();requestAnimationFrame(tick)}

/* QA hook */
function stepWorld(sec,dt){dt=dt||1/60;const n=Math.max(1,Math.round(sec/dt));for(let k=0;k<n;k++)update(dt);return ST.time}
window.__aj={
  version:'1.0.0',
  get gpu(){return GPU.ok},
  state(){const fc=fishCheck();return{time:ST.time,frames,paused:ST.paused,
    gpu:{ok:GPU.ok,why:GPU.why,errors:(GPU.errors||[]).slice(),tris:GPU.tris||0},
    plane:{phase:PL.ph,x:PL.x,y:PL.y,z:PL.z,heading:PL.psi,speed:PL.v,alt:PL.alt,maxAlt:PL.maxAlt,maxHeight:SIM.sea+PL.maxAlt,landings:PL.landings,onWater:PL.onWater,floatGap:PL.gap,pitch:PL.pitch,roll:PL.roll,boost:PL.boost,progress:PL.progress,lastTouch:PL.lastTouch},
    fish:fc,rays:rays.map(r=>({x:r.x,y:r.y,z:r.z,aboveBottom:r.y-terrainH(r.x,r.z),belowSurface:waterY(r.x,r.z)-r.y,panic:r.panic})),
    food:{active:food.length,fed:ST.fed,floating:food.filter(p=>p.state===1).length,sinking:food.filter(p=>p.state===2).length,resting:food.filter(p=>p.state===3).length},
    rings:rings.map(r=>({x:r.x,y:r.y,z:r.z,afloat:r.afloat,held:r.held,submerged:r.sub,aboveWater:r.y-waterY(r.x,r.z),tiltDeg:Math.acos(clamp(r.ny,-1,1))*57.2958,speed:Math.hypot(r.vx,r.vy,r.vz),inside:Math.abs(r.x)<HALF&&Math.abs(r.z)<HALF})),
    floating:rings.filter(r=>r.afloat).length,
    water:{sea:SIM.sea,tideCm:SIM.tide*100,hard:SIM.hard,damp:SIM.damp,energy:SIM.energy,maxEta:SIM.maxEta,foamSum:SIM.foamSum,waveSpeedCap:Math.sqrt(C2MAX),finite:Number.isFinite(SIM.energy)},
    tilt:{ax:TILT.ax,az:TILT.az,held:TILT.held},flavor:{index:ST.flavor,name:FLAVORS[ST.flavor].name},
    camera:{yaw:CAM.yaw,pitch:CAM.pitch,dist:CAM.dist},sim:simStats(),particles:parts.length,scares:scares.length}},
  seaplane:()=>seaplaneAction(),
  feed:(x,z)=>feed(x,z),
  addRing:(x,z,y)=>{addRing(x,z,y);return rings.length},
  grabRing(i){const r=rings[i];if(!r)return false;r.held=true;r.y=SIM.sea+0.42;return true},
  throwRing:(i,vx,vy,vz)=>throwRing(i,vx||0,vy||0,vz||0),
  setFlavor:i=>{setFlavor(i);return ST.flavor},
  setParam:(n,v)=>setParam(n,v),
  pause:b=>{setPaused(b===undefined?!ST.paused:b);return ST.paused},
  reset:()=>{resetWorld();return true},
  resetView:()=>{CAM.yaw=CAM0.yaw;CAM.pitch=CAM0.pitch;CAM.dist=CAM0.dist;camGoal=null;return true},
  setView:(yaw,pitch,dist)=>{if(yaw!==undefined)CAM.yaw=yaw;if(pitch!==undefined)CAM.pitch=clamp(pitch,0.1,1.42);if(dist!==undefined)CAM.dist=clamp(dist,5.5,24);camGoal=null;return true},
  stir:(x,z,str)=>{splash(x,z,str===undefined?1:str);return isWet(x,z)},
  stroke:(x0,z0,x1,z1,steps)=>{steps=steps||12;let px=x0,pz=z0;for(let k=1;k<=steps;k++){const x=lerp(x0,x1,k/steps),z=lerp(z0,z1,k/steps);if(isWet(x,z))stirTo(px,pz,x,z,1/60);px=x;pz=z;update(1/60)}return true},
  scare:(x,z,r)=>{scare(x,z,r||0.7,0.5);return true},
  tilt:(ax,az)=>{TILT.held=true;TILT.tx=clamp(ax||0,-TILT.max,TILT.max);TILT.tz=clamp(az||0,-TILT.max,TILT.max);return true},
  releaseTilt:()=>{TILT.held=false;return true},
  stress:sec=>{ST.stress=sec===undefined?3:sec;for(let k=0;k<6;k++)addRing();feed();return true},
  step:(sec,dt)=>stepWorld(sec===undefined?1/60:sec,dt),
  runCycle(maxSec){const l0=PL.landings;let t=0,maxY=0,minGap=9,sawAir=false;maxSec=maxSec||240;
    while(t<maxSec){update(1/60);t+=1/60;if(!PL.onWater){sawAir=true;if(PL.y>maxY)maxY=PL.y}else if(PL.v>0.05)minGap=Math.min(minGap,Math.abs(PL.gap));if(PL.landings>l0&&PL.ph==='wait')break}
    return{seconds:t,landings:PL.landings,completed:PL.landings>l0&&PL.ph==='wait',sawAir,maxHeight:maxY,maxFloatGap:minGap===9?null:minGap,touch:PL.lastTouch,foamAfter:SIM.foamSum}},
  planeFloats:()=>[[0.2,-0.13],[0.2,0.13],[-0.2,-0.13],[-0.2,0.13]].map(p=>{const w=plPt(p[0],p[1]);return{x:w[0],z:w[1],water:waterY(w[0],w[1])}}),
  fishCheck:()=>fishCheck(),simStats:()=>simStats(),
  sample:{waterY:(x,z)=>waterY(x,z),terrainH:(x,z)=>terrainH(x,z),isWet:(x,z)=>isWet(x,z),groundY:(x,z,y)=>groundY(x,z,y===undefined?9:y)},
  ready:null};
resetWorld();updateView(canvas.clientWidth||1,canvas.clientHeight||1);
window.__aj.ready=(async()=>{let ok=false;try{ok=await initGPU(canvas)}catch(e){GPU.why=String(e&&e.message||e)}
  if(ok){$('pillT').textContent='WEBGPU · 运行中'}else showFallback();
  requestAnimationFrame(tick);return ok})();
